<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>exercise-card making</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing:border-box;
      
    }
    
    .container{
      height:40vh;
      width:320px;
      max-width:350px;
      min-width:250px;
      border:2px solid red;
      background-color:white;
      border-radius:25px;
      box-shadow:0px 5px 3px rgba(85, 40, 230, 0.2);
      overflow:auto;
      margin: 150px auto;
      }


    .container img{
      width: 100%;
      height:20vh;
      object-fit:cover;
      object-position:center;
    }
    .content{
      padding: 20px;
      
    }
    .content span{
      background-color:#e0e0e0;
      padding:5px 12px;
      border-radius:20px;
      font-size: 14px;
      font-weight:bold;
      margin-right:5px;
    }

    .content p{
      color:#555;
      line-height:1.5;
      
    }
    .content button{
      width:100%;
      background-color:#ff5722;
      color:white;
      border:none;
      padding:10px;
      border-radius:8px;
      margin-top:15px;
      font-size:16px;
      font-weight:bold;
    }
    .content h1{
      font-size:20px;
      padding:15px;
      border:none;
      margin-top:15px;
      margin-right:34px;
      background-color:orange;
      border-radius:20px;
      padding:15px;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <img src="https://shivalordimage.com/wp-content/uploads/2026/05/Lord-Shiva-Third-Eye-Opening-Destruction.webp" alt="shivji" >
    
  <div class="content">
    <span>Home</span>
    <span>Shiv Images</span>

    <h1>Welcome to WEB</h1>
  <p>
    
    welcome to our shivji web.This is only for download shivji books and images.
    you can directly download images on our web from click 👇. 
  
  </p>
  <button>Download</button>
    
  </div>
  </div>
</body>
</html>
